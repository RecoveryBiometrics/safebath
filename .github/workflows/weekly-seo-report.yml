name: Weekly SEO Report

on:
  schedule:
    # Every Tuesday at 9am ET (13:00 UTC)
    - cron: '7 13 * * 2'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  seo-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout shared pipeline
        uses: actions/checkout@v4
        with:
          repository: RecoveryBiometrics/agent-command-center
          path: .shared-pipeline
          sparse-checkout: |
            pipelines/seo-reporting
            businesses

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: .shared-pipeline/pipelines/seo-reporting

      - name: Run SEO agent
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BUSINESS_PROJECT_PATH: ${{ github.workspace }}
        run: node index.js --business safebath
        working-directory: .shared-pipeline/pipelines/seo-reporting

      - name: Commit report and data
        run: |
          git config user.name "SEO Agent"
          git config user.email "seo-agent@reiamplifi.com"
          git add seo-reports/ seo-data/
          git diff --staged --quiet || git commit -m "Weekly SEO report $(date +%Y-%m-%d)"
          git push
